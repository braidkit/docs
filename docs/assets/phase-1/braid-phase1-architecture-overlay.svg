<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1460" viewBox="0 0 1800 1460" role="img" aria-labelledby="title desc">
  <title id="title">Braid Phase 0 and Phase 1 architecture</title>
  <desc id="desc">Two-stage architecture showing the controlled Phase 0 VC demo and the hardened Phase 1 design-partner product. Both use a local Braid CLI, daemon, SQLite store, Review UI, Git repository, and a remote bounded Intent Engine.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c2410c"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 40px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #475569; }
      .phase-title { font: 700 27px Arial, sans-serif; fill: #0f172a; }
      .phase-sub { font: 400 17px Arial, sans-serif; fill: #475569; }
      .zone-title { font: 700 17px Arial, sans-serif; fill: #334155; }
      .node-title { font: 700 17px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-sub { font: 400 14px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .node-small { font: 400 13px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .edge-label { font: 700 13px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .legend { font: 700 14px Arial, sans-serif; fill: #334155; }
      .pill-text { font: 700 12px Arial, sans-serif; fill: #ffffff; text-anchor: middle; }

      .phase0-panel { fill: #f8fafc; stroke: #0f766e; stroke-width: 1.6; }
      .phase1-panel { fill: #f8fafc; stroke: #c2410c; stroke-width: 1.6; }
      .local-zone { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
      .remote-zone { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.2; }

      .shared-node { fill: #e0f2fe; stroke: #0369a1; stroke-width: 1.3; }
      .daemon-node { fill: #ede9fe; stroke: #6d28d9; stroke-width: 1.3; }
      .store-node { fill: #dcfce7; stroke: #15803d; stroke-width: 1.3; }
      .ui-node { fill: #fef3c7; stroke: #b45309; stroke-width: 1.3; }
      .git-node { fill: #ffe4e6; stroke: #be123c; stroke-width: 1.3; }
      .intent0-node { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.3; }
      .intent1-node { fill: #ffedd5; stroke: #c2410c; stroke-width: 1.3; }

      .line { stroke: #334155; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .line-bi { stroke: #334155; stroke-width: 1.7; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
      .phase0-line { stroke: #0f766e; stroke-width: 1.7; fill: none; marker-start: url(#arrow-teal); marker-end: url(#arrow-teal); }
      .phase1-line { stroke: #c2410c; stroke-width: 1.7; fill: none; marker-start: url(#arrow-orange); marker-end: url(#arrow-orange); }
      .label-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 0.7; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1460"/>

  <text x="60" y="64" class="title">Braid Phase 0 and Phase 1 Architecture</text>
  <text x="60" y="98" class="subtitle">One local authority model, first proven as a controlled demo and then hardened for design partners.</text>

  <rect x="1010" y="28" width="730" height="88" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="1035" y="50" width="24" height="18" rx="4" class="shared-node"/>
  <text x="1070" y="64" class="legend">Shared local component</text>
  <rect x="1260" y="50" width="24" height="18" rx="4" class="intent0-node"/>
  <text x="1295" y="64" class="legend">Phase 0 demo service</text>
  <rect x="1510" y="50" width="24" height="18" rx="4" class="intent1-node"/>
  <text x="1545" y="64" class="legend">Phase 1 hardened service</text>
  <rect x="1035" y="82" width="24" height="18" rx="4" class="remote-zone"/>
  <text x="1070" y="96" class="legend">Hosted boundary</text>
  <text x="1260" y="96" class="legend">All lifecycle authority remains local</text>

  <!-- Phase 0 -->
  <rect x="45" y="145" width="1710" height="590" rx="22" class="phase0-panel"/>
  <text x="75" y="188" class="phase-title">Phase 0 - VC Demo</text>
  <text x="75" y="218" class="phase-sub">Controlled environment: prove capture, convergence, review, promote and evidence-bounded intent reconstruction.</text>

  <rect x="75" y="245" width="1170" height="455" rx="18" class="local-zone"/>
  <text x="100" y="278" class="zone-title">Local Developer Environment</text>

  <rect x="100" y="325" width="205" height="96" rx="13" class="shared-node"/>
  <text x="202.5" y="361" class="node-title">Agent Runtime</text>
  <text x="202.5" y="386" class="node-sub">Claude Code + Codex</text>
  <text x="202.5" y="407" class="node-small">selected happy paths</text>

  <rect x="365" y="325" width="190" height="96" rx="13" class="shared-node"/>
  <text x="460" y="361" class="node-title">Braid CLI</text>
  <text x="460" y="386" class="node-sub">lifecycle commands</text>
  <text x="460" y="407" class="node-small">assisted setup</text>

  <rect x="660" y="300" width="350" height="146" rx="15" class="daemon-node"/>
  <text x="835" y="341" class="node-title">Local Braid Daemon</text>
  <text x="835" y="368" class="node-sub">admit - verify - fold - gate</text>
  <text x="835" y="391" class="node-sub">HTTP Review API + note context</text>
  <text x="835" y="414" class="node-small">existing orchestrator adapted locally</text>

  <rect x="1070" y="325" width="145" height="96" rx="13" class="store-node"/>
  <text x="1142.5" y="361" class="node-title">SQLite</text>
  <text x="1142.5" y="386" class="node-sub">events + braids</text>
  <text x="1142.5" y="407" class="node-small">daemon-owned</text>

  <rect x="660" y="520" width="350" height="116" rx="15" class="ui-node"/>
  <text x="835" y="561" class="node-title">Review UI</text>
  <text x="835" y="587" class="node-sub">real braid state and evidence</text>
  <text x="835" y="611" class="node-small">demo-ready workflow</text>

  <rect x="365" y="520" width="190" height="116" rx="13" class="git-node"/>
  <text x="460" y="558" class="node-title">Git Repository</text>
  <text x="460" y="584" class="node-sub">merge + signed note</text>
  <text x="460" y="608" class="node-small">refs/notes/braid</text>

  <rect x="1295" y="245" width="425" height="455" rx="18" class="remote-zone"/>
  <text x="1320" y="278" class="zone-title">Hosted Braid Service</text>
  <rect x="1335" y="350" width="345" height="206" rx="15" class="intent0-node"/>
  <text x="1507.5" y="393" class="node-title">Phase 0 Intent Engine</text>
  <text x="1507.5" y="422" class="node-sub">simple hosted Go service</text>
  <text x="1507.5" y="446" class="node-sub">Braid-managed LLM key</text>
  <text x="1507.5" y="470" class="node-sub">structured IntentNoteV1 output</text>
  <text x="1507.5" y="500" class="node-small">no signing or lifecycle authority</text>
  <text x="1507.5" y="524" class="node-small">controlled demo operations</text>

  <!-- Phase 0 lines -->
  <path d="M305 373 L365 373" class="line"/>
  <rect x="314" y="345" width="42" height="21" rx="5" class="label-bg"/>
  <text x="335" y="360" class="edge-label">run</text>

  <path d="M555 373 L660 373" class="line"/>
  <rect x="580" y="345" width="54" height="21" rx="5" class="label-bg"/>
  <text x="607" y="360" class="edge-label">gRPC</text>

  <path d="M1010 373 L1070 373" class="line-bi"/>
  <rect x="1018" y="345" width="44" height="21" rx="5" class="label-bg"/>
  <text x="1040" y="360" class="edge-label">SQL</text>

  <path d="M835 446 L835 520" class="line-bi"/>
  <rect x="803" y="472" width="64" height="21" rx="5" class="label-bg"/>
  <text x="835" y="487" class="edge-label">HTTP</text>

  <path d="M700 446 C650 476 610 520 555 550" class="line"/>
  <rect x="586" y="489" width="70" height="21" rx="5" class="label-bg"/>
  <text x="621" y="504" class="edge-label">sign note</text>

  <path d="M1010 335 C1140 265 1200 300 1335 410" class="phase0-line"/>
  <rect x="1124" y="282" width="174" height="22" rx="5" class="label-bg"/>
  <text x="1211" y="297" class="edge-label">HTTPS - bounded context</text>

  <!-- Phase 1 -->
  <rect x="45" y="770" width="1710" height="640" rx="22" class="phase1-panel"/>
  <text x="75" y="813" class="phase-title">Phase 1 - Design Partners</text>
  <text x="75" y="843" class="phase-sub">Same topology, productized for partner repositories with installation, recovery, security and supportable contracts.</text>

  <rect x="75" y="870" width="1170" height="505" rx="18" class="local-zone"/>
  <text x="100" y="903" class="zone-title">Partner Developer Environment</text>

  <rect x="100" y="960" width="205" height="116" rx="13" class="shared-node"/>
  <text x="202.5" y="998" class="node-title">Agent Runtime</text>
  <text x="202.5" y="1024" class="node-sub">supported Claude + Codex</text>
  <text x="202.5" y="1048" class="node-small">documented capture quality</text>

  <rect x="365" y="960" width="190" height="116" rx="13" class="shared-node"/>
  <text x="460" y="998" class="node-title">Braid CLI</text>
  <text x="460" y="1024" class="node-sub">complete lifecycle</text>
  <text x="460" y="1048" class="node-small">packaged + diagnostics</text>

  <rect x="660" y="930" width="350" height="176" rx="15" class="daemon-node"/>
  <text x="835" y="970" class="node-title">Local Braid Daemon</text>
  <text x="835" y="998" class="node-sub">shared gRPC + HTTP application layer</text>
  <text x="835" y="1022" class="node-sub">migrations - recovery - authentication</text>
  <text x="835" y="1046" class="node-sub">validated note context + signing</text>
  <text x="835" y="1075" class="node-small">managed local user service</text>

  <rect x="1070" y="960" width="145" height="116" rx="13" class="store-node"/>
  <text x="1142.5" y="998" class="node-title">SQLite</text>
  <text x="1142.5" y="1024" class="node-sub">versioned schema</text>
  <text x="1142.5" y="1048" class="node-small">recovery + migration</text>

  <rect x="660" y="1190" width="350" height="130" rx="15" class="ui-node"/>
  <text x="835" y="1230" class="node-title">Developer Review UI</text>
  <text x="835" y="1256" class="node-sub">receipts - refusals - authority actions</text>
  <text x="835" y="1280" class="node-small">documented daemon HTTP API</text>

  <rect x="365" y="1190" width="190" height="130" rx="13" class="git-node"/>
  <text x="460" y="1228" class="node-title">Git + Remote</text>
  <text x="460" y="1254" class="node-sub">signed and pushed notes</text>
  <text x="460" y="1278" class="node-small">fetch + replay verification</text>

  <rect x="1295" y="870" width="425" height="505" rx="18" class="remote-zone"/>
  <text x="1320" y="903" class="zone-title">Hosted Braid Service</text>
  <rect x="1335" y="985" width="345" height="246" rx="15" class="intent1-node"/>
  <text x="1507.5" y="1028" class="node-title">Phase 1 Intent Engine</text>
  <text x="1507.5" y="1057" class="node-sub">authenticated partner requests</text>
  <text x="1507.5" y="1081" class="node-sub">redaction + secret scanning</text>
  <text x="1507.5" y="1105" class="node-sub">versioned structured generation</text>
  <text x="1507.5" y="1129" class="node-sub">timeouts - retries - observability</text>
  <text x="1507.5" y="1159" class="node-small">never receives signing keys</text>
  <text x="1507.5" y="1183" class="node-small">not a remote lifecycle orchestrator</text>

  <!-- Phase 1 lines -->
  <path d="M305 1018 L365 1018" class="line"/>
  <rect x="314" y="990" width="42" height="21" rx="5" class="label-bg"/>
  <text x="335" y="1005" class="edge-label">run</text>

  <path d="M555 1018 L660 1018" class="line"/>
  <rect x="580" y="990" width="54" height="21" rx="5" class="label-bg"/>
  <text x="607" y="1005" class="edge-label">gRPC</text>

  <path d="M1010 1018 L1070 1018" class="line-bi"/>
  <rect x="1018" y="990" width="44" height="21" rx="5" class="label-bg"/>
  <text x="1040" y="1005" class="edge-label">SQL</text>

  <path d="M835 1106 L835 1190" class="line-bi"/>
  <rect x="803" y="1138" width="64" height="21" rx="5" class="label-bg"/>
  <text x="835" y="1153" class="edge-label">HTTP</text>

  <path d="M700 1106 C650 1140 610 1200 555 1225" class="line"/>
  <rect x="566" y="1157" width="84" height="21" rx="5" class="label-bg"/>
  <text x="608" y="1172" class="edge-label">sign + push</text>

  <path d="M1010 965 C1140 895 1200 930 1335 1040" class="phase1-line"/>
  <rect x="1100" y="912" width="220" height="22" rx="5" class="label-bg"/>
  <text x="1210" y="927" class="edge-label">HTTPS - authenticated context</text>

  <text x="900" y="1440" class="phase-sub" text-anchor="middle">Deferred after Phase 1: remote lifecycle Orchestrator, Intent DB, central event draining and cross-repository convergence.</text>
</svg>
