# Prose checks for the page, run in CI with `vale docs/index.md`.
#
# Only Vale's spelling check and a few house rules. The public style packages
# (Google, Microsoft, write-good) were tried and mostly flagged the house style
# itself, such as "Braid" in headings and punctuation outside quotes.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Braid

[*.md]
BasedOnStyles = Vale, Braid
