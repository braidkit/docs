site_name: braid docs
site_url: https://docs.braidkit.io/
site_description: Braid documentation is coming soon.
repo_url: https://github.com/braidkit/docs
repo_name: braidkit/docs

# Keep pre-launch material in source control without publishing it. Remove an
# exclusion only when that page has been reviewed and is ready to publish.
exclude_docs: |
  /getting-started/
  /concepts/
  /protocol/
  /stories/
  /reference/
  /assets/phase-1/
  /javascripts/
  /phase-1-scope.md
  /keeping-docs-current.md
  /deploying.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/logo/braid-mark.svg
  favicon: assets/brand/logo/braid-mark.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins: []

extra_css:
  - stylesheets/brand.css

extra_javascript:
  - javascripts/diagrams.js
  - javascripts/copy-page.js
  - javascripts/external-links.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      # No ¶ marker; heading ids still resolve, so #anchor links keep working.
      permalink: false
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  # External destinations. Any nav entry with an absolute URL renders as
  # the compact linked group at the top of the sidebar (see brand.css).
  - GitHub: https://github.com/braidkit
  - Home: index.md

extra:
  # Marketing tagline; used in the <title> pattern (see overrides/main.html).
  tagline: the work layer for AI software
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/braidkit
      name: Braid on GitHub
  generator: false
