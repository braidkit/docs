name: Docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: mkdocs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m mkdocs build --strict
      - name: Verify the generated corpus
        run: python scripts/build_llms.py --check
      - name: Verify the publishing boundary
        run: |
          test -f site/robots.txt
          test -f site/llms.txt
          test -f site/llms-full.txt
          test -f site/sitemap.xml
          # Every V1 page is published. The placeholder is gone; assert it does
          # not come back.
          test -f site/index.html
          if grep --fixed-strings --quiet "documentation is coming soon" site/index.html; then
            echo "The coming-soon placeholder must not be published." >&2
            exit 1
          fi
          test -d site/why-braid
          test -d site/how-braid-works
          test -d site/lifecycle
          test -d site/what-braid-records
          test -d site/braid-on-your-machine
          test -d site/getting-started/installation
          test -d site/get-help
          test -d site/changelog
      - name: Upload the rendered site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site-${{ github.sha }}
          path: site/
          retention-days: 7
