name: Docs production smoke

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: vars.DOCS_PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/smoke-test.sh "${{ vars.DOCS_PRODUCTION_URL }}"
