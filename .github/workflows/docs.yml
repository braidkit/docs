name: Docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: mkdocs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # Vendored brand files must match scripts/brand.lock. Catches a copy
      # edited here instead of upstream in braidkit/brand, which otherwise
      # builds clean and is silently overwritten by the next propagation. Reads
      # the lock, so no network.
      - run: python scripts/check-brand.py
      - run: python -m unittest discover -s tests -v
      - run: python -m mkdocs build --strict
      - name: Verify the generated corpus
        run: python scripts/build_llms.py --check
      - name: Verify site contracts
        run: python scripts/check_site.py site
      - name: Upload the rendered site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site-${{ github.sha }}
          path: site/
          retention-days: 7
