site_name: Braid Docs
site_url: https://docs.braidkit.io/
site_description: Documentation for Braid, which records the decisions and reasoning behind a change and keeps that record with the code.
repo_url: https://github.com/braidkit/docs
repo_name: braidkit/docs
# Used by the footer's GitHub icon to resolve each rendered page back to its
# source Markdown file on the default branch.
edit_uri: blob/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/logo/braid-mark-purple-512.png
  favicon: assets/brand/logo/braid-avatar-purple-512.png
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Use light theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Use dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Use system theme
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - search.suggest
    - search.highlight
plugins:
  - search

# Generate the agent-readable corpus for local, CI, and Cloudflare builds.
hooks:
  - scripts/build_llms.py
  # Ships each page's Markdown source next to its HTML, at the same URL with a
  # .md extension.
  - scripts/page_markdown.py

# Order matters: tokens define the variables the other two consume.
extra_css:
  - stylesheets/fonts.css
  - stylesheets/tokens.css
  - stylesheets/base.css
  - stylesheets/shell.css
  - stylesheets/home.css
  # Last on purpose: the design language layer only modifies rules the files
  # above have already set. See docs/stylesheets/braid-language.css.
  - stylesheets/braid-language.css

extra_javascript:
  - javascripts/search-shortcut.js
  - javascripts/heading-links.js
  - javascripts/header-sections.js
  - javascripts/copy-markdown.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Get started:
      - Why Braid?: why-braid.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guides:
      - Capture agent work: guides/capture-agent-work.md
      - Understand a change: guides/understand-a-change.md
      - Review a change: guides/review-a-change.md
  - Concepts:
      - How Braid works: how-braid-works.md
      - What Braid records: what-braid-records.md
  - Reference:
      - CLI reference: reference/cli.md
      - Account and devices: reference/account-and-devices.md
      - Braid on your machine: braid-on-your-machine.md
      - Braid and thread lifecycle: lifecycle.md
      - Troubleshooting: troubleshooting.md
      - Preview status: preview-status.md
  - Get help: get-help.md
  - Changelog: changelog.md

extra:
  # One source of truth for the visual home-page navigation. docs/index.md
  # carries the plain-Markdown equivalent; scripts/check_site.py keeps the two
  # in sync for readers of the agent corpus.
  home:
    sections:
      - id: start-here
        title: Start here
        cards:
          - path: getting-started/installation.md
            label: Install Braid
            description: Set up Braid on your Mac.
            icon: download-outline
          - path: getting-started/quickstart.md
            label: Quickstart
            description: Take one change from capture to completion.
            icon: source-branch
          - path: guides/capture-agent-work.md
            label: Capture agent work
            description: Set up capture and organize your sessions.
            icon: record-circle-outline
      - id: keep-moving
        title: Keep moving
        cards:
          - path: guides/understand-a-change.md
            label: Understand a change
            description: Read the decisions and evidence behind the code.
            icon: text-box-search-outline
          - path: guides/review-a-change.md
            label: Review a change
            description: Check the work and complete the braid.
            icon: check-decagram-outline
          - path: reference/cli.md
            label: CLI reference
            description: Find a command or flag.
            icon: console
    explore:
      id: explore-the-docs
      title: Explore the docs
      links:
        - path: why-braid.md
          label: Why Braid?
        - path: how-braid-works.md
          label: How Braid works
        - path: what-braid-records.md
          label: What Braid records
        - path: troubleshooting.md
          label: Troubleshooting
        - path: preview-status.md
          label: Preview status
  # Rendered as the persistent link at the foot of the navigation rail.
  # Omit this block and the link disappears rather than 404s.
  support:
    title: Contact support
    description: Get help on Discord
    link: get-help/
  # Utility pages are published and validated, but rendered outside the main
  # documentation hierarchy by our navigation partial.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/braidkit/docs
      name: View this page on GitHub
      page_source: true
  generator: false
