name: Docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: mkdocs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m mkdocs build --strict
      - name: Verify the publishing boundary
        run: |
          grep --fixed-strings "documentation is coming soon" site/index.html
          test -f site/robots.txt
          test -f site/llms.txt
          test -f site/llms-full.txt
          test -f site/sitemap.xml
          # The placeholder home page and the installation page are the whole
          # published site until the V1 pages land.
          test -d site/getting-started/installation
          test -d site/get-help
      - name: Upload the rendered site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site-${{ github.sha }}
          path: site/
          retention-days: 7
