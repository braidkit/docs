site_name: Braid Docs
site_url: https://docs.braidkit.io/
site_description: Documentation for Braid, which records the decisions and reasoning behind a change and keeps that record with the code.
repo_url: https://github.com/braidkit/docs
repo_name: braidkit/docs
# Used by the footer's GitHub icon to resolve each rendered page back to its
# source Markdown file on the default branch.
edit_uri: blob/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/logo/braid-mark-purple-512.png
  favicon: assets/brand/icons/icon.svg
  font: false
  # System, Light and Dark, in that order: overrides/partials/palette.html
  # draws them as the Review UI's theme switch.
  palette:
    - media: "(prefers-color-scheme)"
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tooltips
# The quickstart and guide link to each other. Keep search disabled; leaving
# this key out would turn MkDocs' default search plugin back on.
plugins: []

# Generate the agent-readable corpus for local, CI, and Cloudflare builds.
hooks:
  - scripts/build_llms.py
  # Ships each page's Markdown source next to its HTML, at the same URL with a
  # .md extension.
  - scripts/page_markdown.py

# Order matters: tokens define the variables the other two consume.
extra_css:
  # First: the shared brand tokens, vendored from braidkit/brand. Everything
  # below derives from these rather than declaring its own values.
  - stylesheets/braid-tokens.css
  - stylesheets/fonts.css
  - stylesheets/tokens.css
  - stylesheets/base.css
  - stylesheets/shell.css

extra_javascript:
  - javascripts/heading-links.js
  - javascripts/copy-markdown.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Braid: index.md
  - Guides:
      - BrewGo with parallel subagents: guides/brewgo-subagents.md

extra:
  # Rendered as the help link in the header. Omit this block and the link
  # disappears rather than 404s.
  support:
    title: Get help
    link: https://discord.gg/G3wzPsKtR
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/braidkit/docs
      name: View this page on GitHub
      page_source: true
  generator: false
