site_name: Braid Docs
site_url: https://docs.braidkit.io/
site_description: Braid documentation is coming soon.
repo_url: https://github.com/braidkit/docs
repo_name: braidkit/docs

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/logo/braid-mark-purple-512.png
  favicon: assets/brand/logo/braid-avatar-purple-512.png
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Use light theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Use dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Use system theme
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - search.suggest
    - search.highlight
plugins:
  - search

# Prototype pages exercise the complete documentation shell in local previews.
# Production keeps them out of the build until their content is reviewed, along
# with the stylesheet that only dresses them. mkdocs.preview.yml clears this.
exclude_docs: |
  prototype/
  stylesheets/prototype.css

# Order matters: tokens define the variables the other two consume.
extra_css:
  - stylesheets/fonts.css
  - stylesheets/tokens.css
  - stylesheets/base.css
  - stylesheets/shell.css

extra_javascript:
  - javascripts/search-shortcut.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Installation: getting-started/installation.md
  - Get help: get-help.md

extra:
  # Rendered as the persistent link at the foot of the navigation rail.
  # Omit this block and the link disappears rather than 404s.
  support:
    title: Contact support
    description: Get help on Discord
    link: get-help/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/braidkit
      name: Braid on GitHub
  generator: false
