site_name: Braid Docs
site_url: https://docs.braidkit.io/
site_description: Braid documentation is coming soon.
repo_url: https://github.com/braidkit/docs
repo_name: braidkit/docs

# Keep the pre-launch material in source control without publishing it. BRA-197
# owns the content audit and will remove exclusions page by page as content is
# reviewed for Braid V1.
exclude_docs: |
  /getting-started/
  /concepts/
  /protocol/
  /stories/
  /reference/
  /assets/phase-1/
  /javascripts/
  /phase-1-scope.md
  /keeping-docs-current.md
  /deploying.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/logo/braid-mark-purple-512.png
  favicon: assets/brand/logo/braid-avatar-purple-512.png
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  palette:
    - scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins: []

extra_css:
  - stylesheets/brand.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/braidkit
      name: Braid on GitHub
  generator: false
