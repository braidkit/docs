# Local preview only. Never deployed.
#
# The published site is built from mkdocs.yml, which holds pages back until they
# are ready. This config renders everything in docs/ instead, and builds its nav
# from the file tree so it works on any branch whatever pages exist there.
#
#   mkdocs serve -f mkdocs.preview.yml
#
# Nothing here changes what gets published. CI builds mkdocs.yml.
INHERIT: ./mkdocs.yml
exclude_docs: ""

# null clears the inherited production nav so MkDocs discovers every page.
nav: null

# INHERIT merges maps but replaces lists, so the production sheets have to be
# restated. prototype.css only dresses the throwaway pages under docs/prototype/
# and is never part of the published site.
extra_css:
  - stylesheets/tokens.css
  - stylesheets/base.css
  - stylesheets/shell.css
  - stylesheets/prototype.css
