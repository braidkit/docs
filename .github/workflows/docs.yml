name: Docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: mkdocs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m mkdocs build --strict
      - name: Verify the pre-launch publishing boundary
        run: |
          grep --fixed-strings "documentation is coming soon" site/index.html
          test -f site/robots.txt
          test -f site/llms.txt
          test -f site/llms-full.txt
          test -f site/sitemap.xml
          test ! -d site/getting-started
          test ! -d site/concepts
          test ! -d site/protocol
          test ! -d site/stories
          test ! -d site/reference
      - name: Upload the rendered site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site-${{ github.sha }}
          path: site/
          retention-days: 7
