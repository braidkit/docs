site_name: Braid Docs
site_url: https://docs.braidkit.io/
site_description: Documentation for Braid, which records the decisions and reasoning behind a change and keeps that record with the code.
repo_url: https://github.com/braidkit/docs
repo_name: braidkit/docs

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/logo/braid-mark-purple-512.png
  favicon: assets/brand/logo/braid-avatar-purple-512.png
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tooltips
plugins: []

extra_css:
  - stylesheets/brand.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - How Braid works: how-braid-works.md
  - Braid and thread lifecycle: lifecycle.md
  - What Braid records: what-braid-records.md
  - Braid on your machine: braid-on-your-machine.md
  - Installation: getting-started/installation.md
  - Get help: get-help.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/braidkit
      name: Braid on GitHub
  generator: false
